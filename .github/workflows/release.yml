name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X takl/internal/version.Version=$VERSION -X takl/internal/version.GitCommit=$COMMIT -X takl/internal/version.BuildDate=$DATE"
          go build -ldflags="$LDFLAGS" -o takld-${GOOS}-${GOARCH}${EXT} ./cmd/takld
          go build -ldflags="$LDFLAGS" -o taklctl-${GOOS}-${GOARCH}${EXT} ./cmd/taklctl
        shell: bash
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            takld-*
            taklctl-*

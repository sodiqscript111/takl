syntax = "proto3";

package takl.v1;

option go_package = "takl/internal/transport/pb;pb";

message HLC {
  int64 ts = 1;
  int64 seq = 2;
}

message Row {
  string kind = 1;
  string key = 2;
  string owner = 3;
  HLC hlc = 4;
  bool tombstone = 5;
  bytes payload = 6;
}

message PullRequest {
  string node_id = 1;
  // 2-5 were per-kind HLC watermarks and checksums (removed: HLC watermarks
  // skip rows that reach a node late through a relay).
  reserved 2, 3, 4, 5;
  // The requester's own store id.
  string store_id = 6;
  // The server store that since_version refers to. If it is not the server's
  // current store id, the server sends everything.
  string peer_store_id = 7;
  // Highest server-local version the requester has already pulled.
  uint64 since_version = 8;
  // The requester has forgotten peer_store_id: the server must wipe its store
  // before it is synced with again.
  bool forgotten = 9;
}

message Event {
  string runner_id = 1;
  int64 seq = 2;
  string type = 3;
  string payload = 4;
  HLC hlc = 5;
  // Store id of the node that emitted the event; (origin, runner_id, seq) is unique.
  string origin = 6;
}

message PullResponse {
  string node_id = 1;
  repeated Row rows = 2;
  reserved 3, 5;
  repeated Event events = 4;
  string store_id = 6;
  // The server's current version: every change up to it is in this response,
  // so it is the requester's new watermark.
  uint64 version = 7;
  // The server has forgotten the requester's store: the requester must wipe.
  bool forgotten = 8;
}

service SyncService {
  rpc Pull(PullRequest) returns (PullResponse);
}
